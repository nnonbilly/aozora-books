<h1>青空文庫 縦書きデータ</h1>
<p>青空文庫の作品を、縦書き・見開きで表示しやすい形に変換した公開データです。VRChat などのワールドから、どなたでも無料で利用できます。</p>
<ul>
  <li>作品一覧: <code>books/index.txt</code></li>
  <li>作品データ: <code>books/&lt;idの先頭2文字&gt;/&lt;id&gt;.txt</code></li>
</ul>
<p>本文の出典は <a href="https://www.aozora.gr.jp/">青空文庫</a> です。各作品の最後に、底本と入力・校正者の情報があります。著作権が存続している作品は含めていません。変換データ自体は CC0（権利放棄）とします。</p>
